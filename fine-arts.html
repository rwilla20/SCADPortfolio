<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riley Willard - Fine Arts</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="https://use.typekit.net/lez4ize.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-fine-arts">
  <div class="scene scene-light">
    <!-- Navigation -->
    <nav class="navbar navbar-green navbar-visible">
      <button class="menu-toggle">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="nav-logo">
        <img src="assets/RileyWillard_3dAnimator_Typography.svg" alt="Riley Willard 3D Animator">
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-item" data-page="home">Demo Reel</a>
        <a href="animation.html" class="nav-item" data-page="animation">Animation</a>
        <a href="production.html" class="nav-item" data-page="production">Production</a>
        <a href="fine-arts.html" class="nav-item active" data-page="fine-arts">Fine Arts</a>
        <a href="resume.html" class="nav-item" data-page="resume">Resume</a>
        <a href="about.html" class="nav-item" data-page="about">About Me</a>
      </div>
      <div class="nav-contact-info">
        <a href="mailto:rileywillardportfolio@gmail.com" class="nav-contact nav-email">rileywillardportfolio@gmail.com</a>
      </div>
    </nav>

    <!-- Fine Arts Content -->
    <div class="fine-arts-content">
      <h1>Fine Arts</h1>
      
      <!-- Scrapbook Container -->
      <div class="scrapbook-container">
        <img src="assets/scrapbook.png" alt="Scrapbook" class="scrapbook-background">
        
        <!-- Two Slideshows Side by Side -->
        <div class="scrapbook-slideshows">
          
          <!-- Left Slideshow - Artwork (31 PDFs) -->
          <div class="scrapbook-slideshow left-slideshow">
            <h2>Artwork</h2>
            
            <!-- PDF Display -->
            <div class="scrapbook-pdf-display">
              <iframe id="artwork-pdf" src="assets/fine-arts/artwork/artwork-1.pdf#view=FitH&toolbar=0&navpanes=0"></iframe>
            </div>
            
            <!-- Controls -->
            <div class="scrapbook-controls">
              <button class="scrapbook-nav prev" id="artwork-prev" aria-label="Previous">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
              </button>
              
              <div class="scrapbook-counter">
                <span id="artwork-current">1</span> / <span id="artwork-total">31</span>
              </div>
              
              <button class="scrapbook-nav next" id="artwork-next" aria-label="Next">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </button>
            </div>
          </div>
          
          <!-- Right Slideshow - Paintings (10 PDFs) -->
          <div class="scrapbook-slideshow right-slideshow">
            <h2>Paintings</h2>
            
            <!-- PDF Display -->
            <div class="scrapbook-pdf-display">
              <iframe id="paintings-pdf" src="assets/fine-arts/paintings/paint-1.pdf#view=FitH&toolbar=0&navpanes=0"></iframe>
            </div>
            
            <!-- Controls -->
            <div class="scrapbook-controls">
              <button class="scrapbook-nav prev" id="paintings-prev" aria-label="Previous">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
              </button>
              
              <div class="scrapbook-counter">
                <span id="paintings-current">1</span> / <span id="paintings-total">10</span>
              </div>
              
              <button class="scrapbook-nav next" id="paintings-next" aria-label="Next">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </button>
            </div>
          </div>
          
        </div>
      </div>
    </div>
  </div>

  <script src="script-fine-arts.js"></script>
  <script src="mobile.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Riley Willard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@300;400;500;600&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav>
    <div class="wrap">
      <a href="index.html" class="nav-mark" aria-label="Riley Willard — home">
        <img src="images/rw-mark.png" alt="RW monogram">
        <span class="nav-mark-text">Riley <em>Willard</em></span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html" style="--accent:var(--gold);">Home</a></li>
        <li><a href="about.html" style="--accent:var(--blue);">About</a></li>
        <li><a href="projects.html" class="current" style="--accent:var(--peach);">Projects</a></li>
        <li><a href="animation.html" style="--accent:var(--sage);">Animation</a></li>
        <li><a href="contact.html" style="--accent:var(--lavender);">Contact</a></li>
      </ul>
    </div>
  </nav>

  <div class="accent-topbar" style="--accent:var(--peach);"></div>

  <section class="reel-section page-glow" id="projects" style="--accent:var(--peach); --accent-deep:#b06f4e;">
    <div class="wrap page-header">
      <div class="marquee-title-frame">
        <div class="marquee-title-lights">
          <div class="edge top"></div><div class="edge bottom"></div>
          <div class="edge left"></div><div class="edge right"></div>
        </div>
        <div class="marquee-title-label">Now Screening</div>
      </div>
      <div class="section-title-bar"></div>
      <h2>Projects</h2>
    </div>
    <div class="wrap-wide" style="position:relative; z-index:1;">
      <div class="poster-grid" id="posterGrid">

        <button class="poster-card" data-project="0">
          <div class="poster-frame">
            <div class="poster-lights">
              <div class="edge top"></div><div class="edge bottom"></div>
              <div class="edge left"></div><div class="edge right"></div>
            </div>
            <div class="poster-body has-image">
              <img class="poster-image" src="images/projects/mian-poster.jpg" alt="Me in a Nutshell movie poster — a small acorn-shelled creature stands on a pile of blueberries in a glowing forest">
              <div class="poster-caption">
                <div class="poster-caption-row">
                  <span class="type">3D Animated Short Film</span>
                  <span class="cta">See the reel →</span>
                </div>
              </div>
            </div>
          </div>
        </button>

        <button class="poster-card" data-project="2">
          <div class="poster-frame">
            <div class="poster-lights">
              <div class="edge top"></div><div class="edge bottom"></div>
              <div class="edge left"></div><div class="edge right"></div>
            </div>
            <div class="poster-body has-image">
              <img class="poster-image poster-image--inset" src="images/projects/broomsmith-poster.jpg" alt="Broomsmith title art — a young wizard holding a mallet, sparks flying from a glowing broom-in-progress">
              <div class="poster-caption">
                <div class="poster-caption-row">
                  <span class="type">VR Video Game</span>
                  <span class="cta">See the reel →</span>
                </div>
              </div>
            </div>
          </div>
        </button>

        <button class="poster-card" data-project="1">
          <div class="poster-frame">
            <div class="poster-lights">
              <div class="edge top"></div><div class="edge bottom"></div>
              <div class="edge left"></div><div class="edge right"></div>
            </div>
            <div class="poster-body has-image">
              <img class="poster-image" src="images/projects/gonewrong-poster.jpg" alt="Gone Wrong poster — a grinning, hollow-eyed creature looms in a dark room">
              <div class="poster-caption">
                <div class="poster-caption-title">Gone Wrong</div>
                <div class="poster-caption-row">
                  <span class="type">Visual Effects Short Film</span>
                  <span class="cta">See the reel →</span>
                </div>
              </div>
            </div>
          </div>
        </button>

      </div>

      <!-- info appears here, underneath the posters, and swaps as you click -->
      <div class="project-detail" id="projectDetail">
        <div class="project-detail-panel">
          <div class="modal-eyebrow" id="detailEyebrow">3D Animated Short Film</div>
          <h3 id="detailTitle">Me in a Nut Shell</h3>
          <p class="modal-paragraph" id="detailParagraph"></p>

          <div id="stillsSection">
            <div class="modal-subhead">Stills</div>
            <div class="stills-gallery">
              <button class="gallery-nav prev" id="stillsPrev" aria-label="Previous still">‹</button>
              <div class="gallery-viewport" id="stillsViewport">
                <div class="gallery-content" id="stillsContent"></div>
                <button class="gallery-fullscreen-btn" id="stillsFullscreenBtn" aria-label="View full screen">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
                </button>
                <div class="gallery-counter" id="stillsCounter"></div>
              </div>
              <button class="gallery-nav next" id="stillsNext" aria-label="Next still">›</button>
            </div>
          </div>

          <div class="modal-subhead">Videos</div>
          <div class="modal-video-grid" id="detailVideos"></div>
        </div>
      </div>

      <!-- fullscreen stills viewer -->
      <div class="gallery-lightbox-overlay" id="galleryLightbox">
        <button class="gallery-lightbox-close" id="galleryLightboxClose" aria-label="Close full screen">✕</button>
        <button class="gallery-lightbox-nav prev" id="galleryLightboxPrev" aria-label="Previous still">‹</button>
        <div class="gallery-lightbox-img-wrap" id="galleryLightboxImgWrap"></div>
        <button class="gallery-lightbox-nav next" id="galleryLightboxNext" aria-label="Next still">›</button>
        <div class="gallery-lightbox-counter" id="galleryLightboxCounter"></div>
      </div>

    </div>
  </section>

  <footer class="site-footer">
    <div class="wrap">
      <a href="index.html" class="nav-mark">
        <img src="images/rw-mark.png" alt="RW monogram">
        <span class="nav-mark-text">Riley <em>Willard</em></span>
      </a>
      <span class="site-footer-meta">Character Animation · SCAD · 2026</span>
    </div>
  </footer>

<script>
  const PROJECTS = [
    {
      eyebrow: '3D Animated Short Film',
      title: 'Me in a Nut Shell',
      paragraph: "In the middle of the woods, a little creature tries to find where he belongs.",
      stills: [
        'images/projects/mian-still-1.jpg',
        'images/projects/mian-still-2.jpg',
        'images/projects/mian-still-3.jpg',
        'images/projects/mian-still-4.jpg',
        'images/projects/mian-still-5.jpg',
        'images/projects/mian-still-6.jpg',
        'images/projects/mian-still-7.jpg',
      ],
      videos: [
        { src: 'videos/mian-trailer.mp4', poster: 'images/projects/mian-poster.jpg', label: 'Trailer' },
        { src: 'videos/mian-shot-10.mp4', poster: '', label: 'Shot 10' },
        { src: 'videos/mian-shots-13-16.mp4', poster: '', label: 'Shots 13–16' },
      ],
    },
    {
      eyebrow: 'Visual Effects Short Film',
      title: 'Gone Wrong',
      paragraph: "A visual effects short film following a group of friends whose ghost hunt goes sideways when they discover the abandoned house they're exploring is home to something much worse than a ghost.",
      stillsCount: 0,
      videos: [
        { src: 'videos/projects/gonewrong-shot1.mp4', poster: '', label: 'Shot 001 — Render' },
        { src: 'videos/projects/gonewrong-shot2.mp4', poster: '', label: 'Shot 002 — Comp' },
        { src: 'videos/projects/gonewrong-shot3.mp4', poster: '', label: 'Shot 003 — Render' },
        { src: 'videos/projects/gonewrong-shot4.mp4', poster: '', label: 'Shot 004 — Comp' },
      ],
    },
    {
      eyebrow: 'VR Video Game',
      title: 'Broomsmith',
      paragraph: "Add a short paragraph here about the project — the brief, your role, the tools you used, and what you're proud of.",
      stillsCount: 0,
      videos: [
        { src: 'videos/projects/broomsmith-trailer.mp4', poster: 'images/projects/broomsmith-poster.jpg', label: 'Trailer' },
      ],
    },
  ];

  const detail = document.getElementById('projectDetail');
  const detailEyebrow = document.getElementById('detailEyebrow');
  const detailTitle = document.getElementById('detailTitle');
  const detailParagraph = document.getElementById('detailParagraph');
  const detailVideos = document.getElementById('detailVideos');
  const posterCards = document.querySelectorAll('.poster-card');
  const stillsSection = document.getElementById('stillsSection');

  const stillsContent = document.getElementById('stillsContent');
  const stillsCounter = document.getElementById('stillsCounter');
  const stillsPrev = document.getElementById('stillsPrev');
  const stillsNext = document.getElementById('stillsNext');
  const stillsFullscreenBtn = document.getElementById('stillsFullscreenBtn');

  const galleryLightbox = document.getElementById('galleryLightbox');
  const galleryLightboxImgWrap = document.getElementById('galleryLightboxImgWrap');
  const galleryLightboxCounter = document.getElementById('galleryLightboxCounter');
  const galleryLightboxClose = document.getElementById('galleryLightboxClose');
  const galleryLightboxPrev = document.getElementById('galleryLightboxPrev');
  const galleryLightboxNext = document.getElementById('galleryLightboxNext');

  const stillIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="4" width="18" height="16" rx="1"/><circle cx="8.5" cy="10" r="1.6"/><path d="M21 16l-5.5-5.5L9 17"/></svg>';
  const videoIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M10 9.5l5 2.5-5 2.5z" fill="currentColor" stroke="none"/></svg>';

  let openIndex = null;
  let stillsList = [];
  let currentStillIndex = 0;
  let lightboxOpen = false;

  function buildStillsList(p){
    if(p.stills && p.stills.length){
      return p.stills.map((src, i) => ({ type: 'image', src, alt: `${p.title} — still ${i+1}` }));
    }
    const n = p.stillsCount || 0;
    return Array.from({ length: n }, (_, i) => ({ type: 'placeholder', label: `Still ${i+1}` }));
  }

  function renderStillSlide(){
    const slide = stillsList[currentStillIndex];
    if(!slide){
      stillsContent.innerHTML = '';
      stillsCounter.textContent = '';
      return;
    }
    stillsContent.innerHTML = slide.type === 'image'
      ? `<img src="${slide.src}" alt="${slide.alt}">`
      : `<div class="gallery-placeholder">${stillIcon}<span>${slide.label}</span></div>`;
    stillsCounter.textContent = `${currentStillIndex + 1} / ${stillsList.length}`;
    stillsPrev.disabled = stillsList.length <= 1;
    stillsNext.disabled = stillsList.length <= 1;

    if(lightboxOpen) renderLightboxSlide();
  }

  function stepStill(delta){
    if(!stillsList.length) return;
    currentStillIndex = (currentStillIndex + delta + stillsList.length) % stillsList.length;
    renderStillSlide();
  }

  function renderLightboxSlide(){
    const slide = stillsList[currentStillIndex];
    if(!slide){ galleryLightboxImgWrap.innerHTML = ''; return; }
    galleryLightboxImgWrap.innerHTML = slide.type === 'image'
      ? `<img src="${slide.src}" alt="${slide.alt}">`
      : `<div class="gallery-placeholder" style="color:#f1e6cc;">${stillIcon}<span>${slide.label}</span></div>`;
    galleryLightboxCounter.textContent = `${currentStillIndex + 1} / ${stillsList.length}`;
  }

  function openLightbox(){
    if(!stillsList.length) return;
    lightboxOpen = true;
    renderLightboxSlide();
    galleryLightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox(){
    lightboxOpen = false;
    galleryLightbox.classList.remove('open');
    document.body.style.overflow = '';
  }

  stillsPrev.addEventListener('click', () => stepStill(-1));
  stillsNext.addEventListener('click', () => stepStill(1));
  stillsFullscreenBtn.addEventListener('click', openLightbox);
  galleryLightboxClose.addEventListener('click', closeLightbox);
  galleryLightboxPrev.addEventListener('click', () => stepStill(-1));
  galleryLightboxNext.addEventListener('click', () => stepStill(1));
  galleryLightbox.addEventListener('click', (e) => { if(e.target === galleryLightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => {
    if(!lightboxOpen) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowLeft') stepStill(-1);
    if(e.key === 'ArrowRight') stepStill(1);
  });

  function fillDetail(index){
    const p = PROJECTS[index];
    detailEyebrow.textContent = p.eyebrow;
    detailTitle.textContent = p.title;
    detailParagraph.textContent = p.paragraph;

    stillsList = buildStillsList(p);
    currentStillIndex = 0;
    stillsSection.style.display = stillsList.length ? '' : 'none';
    renderStillSlide();

    detailVideos.innerHTML = '';
    if(p.videos && p.videos.length){
      p.videos.forEach(v => {
        detailVideos.innerHTML += `<div class="video-tile"><video class="video-tile-media" controls preload="metadata" poster="${v.poster || ''}"><source src="${v.src}" type="video/mp4"></video><div class="video-caption">${v.label}</div></div>`;
      });
    } else {
      for(let i=0;i<(p.videosCount||0);i++){ detailVideos.innerHTML += `<div class="video-slot">${videoIcon}<span>Video ${i+1}</span></div>`; }
    }
  }

  function selectProject(index){
    posterCards.forEach(c => c.classList.toggle('active', Number(c.dataset.project) === index));
    if(openIndex === index){
      detail.classList.remove('open');
      posterCards.forEach(c => c.classList.remove('active'));
      openIndex = null;
      closeLightbox();
      return;
    }
    fillDetail(index);
    detail.classList.add('open');
    openIndex = index;
    closeLightbox();
  }

  posterCards.forEach(card => {
    card.addEventListener('click', () => selectProject(Number(card.dataset.project)));
  });
</script>

</body>
</html>

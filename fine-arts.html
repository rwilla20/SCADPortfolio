<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riley Willard - Fine Arts</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="https://use.typekit.net/lez4ize.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-fine-arts">
  <div class="scene scene-light">
    <!-- Navigation -->
    <nav class="navbar navbar-green navbar-visible">
      <button class="menu-toggle">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="nav-logo">
        <img src="assets/RileyWillard_3dAnimator_Typography.svg" alt="Riley Willard 3D Animator">
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-item" data-page="home">Demo Reel</a>
        <a href="animation.html" class="nav-item" data-page="animation">Animation</a>
        <a href="production.html" class="nav-item" data-page="production">Production</a>
        <a href="fine-arts.html" class="nav-item active" data-page="fine-arts">Fine Arts</a>
        <a href="resume.html" class="nav-item" data-page="resume">Resume</a>
        <a href="about.html" class="nav-item" data-page="about">About Me</a>
      </div>
      <div class="nav-contact-info">
        <a href="mailto:rileywillardportfolio@gmail.com" class="nav-contact nav-email">rileywillardportfolio@gmail.com</a>
      </div>
    </nav>

    <!-- Fine Arts Content -->
    <div class="fine-arts-content">
      <h1>Fine Arts</h1>
      
      <!-- PDF Slideshow -->
      <div class="pdf-slideshow">
        <!-- Navigation Arrows -->
        <button class="slide-nav prev-slide" id="prev-slide" aria-label="Previous artwork">
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>

        <!-- PDF Display Area -->
        <div class="pdf-display">
          <iframe id="current-pdf" src="assets/fine-arts/artwork-1.pdf" type="application/pdf"></iframe>
          <p class="pdf-fallback">
            If the PDF doesn't display, 
            <a href="#" id="pdf-download" download>click here to download it</a>
          </p>
        </div>

        <button class="slide-nav next-slide" id="next-slide" aria-label="Next artwork">
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>

      <!-- Slide Counter & Thumbnails -->
      <div class="slideshow-controls">
        <div class="slide-counter">
          <span id="current-slide-num">1</span> / <span id="total-slides">10</span>
        </div>
        
        <!-- Thumbnail Navigation -->
        <div class="thumbnail-container" id="thumbnail-container">
          <!-- Thumbnails will be generated by JavaScript -->
        </div>
      </div>
    </div>
  </div>

  <script src="script-fine-arts.js"></script>
  <script src="mobile.js"></script>
</body>
</html>

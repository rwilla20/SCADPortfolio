<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riley Willard - Animation</title>
  <link rel="stylesheet" href="https://use.typekit.net/lez4ize.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-animation">
  <div class="scene scene-light">
    <!-- Navigation with Logo -->
    <nav class="navbar navbar-green navbar-visible">
      <button class="menu-toggle">
        <span></span>
        <span></span>
        <span></span>
      </button> 
      <div class="nav-logo">
        <img src="assets/RileyWillard_3dAnimator_Typography.svg" alt="Riley Willard 3D Animator">
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-item" data-page="home">Demo Reel</a>
        <a href="animation.html" class="nav-item active" data-page="animation">Animation</a>
        <a href="production.html" class="nav-item" data-page="production">Production</a>
        <a href="resume.html" class="nav-item" data-page="resume">Resume</a>
        <a href="about.html" class="nav-item" data-page="about">About Me</a>
      </div>
      <div class="nav-contact-info">
        <a href="mailto:rileywillardportfolio@gmail.com" class="nav-contact nav-email">rileywillardportfolio@gmail.com</a>
      </div>
    </nav>

    <!-- Animation Content -->
    <div class="animation-content">
      
      <!-- Animation Project 1: Midas Touch -->
      <div class="animation-project">
        <div class="animation-main">
          <h2>Midas Touch</h2>
        </div>
        
        <!-- Final Animation - Large -->
        <div class="final-animation">
          <h3>Final Animation</h3>
          <video controls>
            <source src="assets/animation/RileyWillard_Final.mp4" type="video/mp4">
          </video>
        </div>
        
        <!-- Process Videos -->
        <div class="animation-process-3col">
          <div class="process-column-left">
            <div class="process-box">
              <h3>Reference Video</h3>
              <video controls>
                <source src="assets/animation/RileyWillard_Reference.mp4" type="video/mp4">
              </video>
            </div>
          </div>
          <div class="process-box-right">
            <div class="process-box">
              <h3>First Pass</h3>
              <video controls>
                <source src="assets/animation/RileyWillard_FirstPass.mp4" type="video/mp4">
              </video>
            </div>
            <div class="process-box">
              <h3>Second Pass</h3>
              <video controls>
                <source src="assets/animation/RileyWillard_SecondPass.mp4" type="video/mp4">
              </video>
            </div>
          </div>
        </div>
      </div>

      <!-- Project Divider -->
      <div class="project-divider"></div>

      <!-- Animation Project 2: Lip Sync -->
      <div class="animation-project">
        <div class="animation-main">
          <h2>Lip Sync</h2>
        </div>
        
        <!-- Final Animation - Large -->
        <div class="final-animation">
          <h3>Final Animation</h3>
          <video controls>
            <source src="assets/animation/RileyWillardLS_Final.mp4" type="video/mp4">
          </video>
        </div>
        
        <!-- Process Videos -->
        <div class="animation-process-3col">
          <div class="process-column-left">
            <div class="process-box">
              <h3>Blocking</h3>
              <video controls>
                <source src="assets/animation/RileyWillard_Blocking.mp4" type="video/mp4">
              </video>
            </div>
          </div>
          <div class="process-box-right">
            <div class="process-box">
              <h3>First Pass</h3>
              <video controls>
                <source src="assets/animation/RileyWillardLS_FirstPass.mp4" type="video/mp4">
              </video>
            </div>
            <div class="process-box">
              <h3>Second Pass</h3>
              <video controls>
                <source src="assets/animation/RileyWillardLS_SecondPass.mp4" type="video/mp4">
              </video>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <img class="lightbox-content" id="lightbox-img" src="" alt="">
    <video class="lightbox-content" id="lightbox-video" src="" controls></video>
  </div>

  <script src="script-animation.js"></script>
  <script src="mobile.js"></script>
</body>
</html>

<body class="page-home">
  <div class="scene scene-light">
    
    <!-- Navigation -->
    <nav class="navbar navbar-visible">
      <a href="index.html" class="nav-item active" data-page="home">Demo Reel</a>
      <a href="animation.html" class="nav-item" data-page="animation">Animation</a>

    <!-- Lamp with String -->
    <div class="lamp-home-container">
      <img src="assets/lampon_home_noshadow.svg" class="lamp-svg lamp-home active" alt="Lamp">
      <img src="assets/lampon_string.svg" class="lamp-svg string-home clickable active" alt="String">
    </div>

    <!-- Prompt Text -->
    <div class="home-prompt visible">
      <h1>Turn off the light!</h1>
      <p>The show's about to start!</p>
    </div>

    <!-- Demo Reel Video (hidden initially) -->
    <div class="demoreel-container">
      <div class="demoreel-video">
        <iframe 
          src="https://www.youtube.com/embed/YOUR_VIDEO_ID" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>
    </div>
  </div>

  <audio id="string-sound" preload="auto">
    <source src="assets/string-pull.mp3" type="audio/mpeg">
  </audio>

  <script src="script-home.js"></script>
</body>

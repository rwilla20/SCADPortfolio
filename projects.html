<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@300;400;500;600&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav>
    <div class="wrap">
      <a href="index.html" class="nav-mark" aria-label="Riley Willard — home">
        <img src="images/rw-mark.png" alt="RW monogram">
        <span class="nav-mark-text">Riley <em>Willard</em></span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html" style="--accent:var(--gold);">Home</a></li>
        <li><a href="about.html" style="--accent:var(--blue);">About</a></li>
        <li><a href="projects.html" class="current" style="--accent:var(--peach);">Projects</a></li>
        <li><a href="animation.html" style="--accent:var(--sage);">Animation</a></li>
        <li><a href="contact.html" style="--accent:var(--lavender);">Contact</a></li>
      </ul>
    </div>
  </nav>

  <div class="accent-topbar" style="--accent:var(--peach);"></div>

  <section class="reel-section page-glow" id="projects" style="--accent:var(--peach); --accent-deep:#b06f4e;">
    <div class="project-detail-bg-bleed" id="projectDetailBgBleed"></div>
    <div class="wrap-wide" style="position:relative; z-index:1; padding-top:28px;">
      <div class="poster-grid" id="posterGrid">

        <button class="poster-card" data-project="0">
          <div class="poster-frame">
            <div class="poster-body has-image">
              <img class="poster-image" src="images/projects/mian-poster.jpg" alt="Me in a Nutshell movie poster — a small acorn-shelled creature stands on a pile of blueberries in a glowing forest">
              <div class="poster-caption">
                <div class="poster-caption-row">
                  <span class="type">3D Animated Short Film</span>
                  <span class="cta">See the reel →</span>
                </div>
              </div>
            </div>
          </div>
        </button>

        <button class="poster-card" data-project="2">
          <div class="poster-frame">
            <div class="poster-body has-image">
              <img class="poster-image poster-image--inset" src="images/projects/broomsmith-poster.jpg" alt="Broomsmith title art — a young wizard holding a mallet, sparks flying from a glowing broom-in-progress">
              <div class="poster-caption">
                <div class="poster-caption-row">
                  <span class="type">VR Video Game</span>
                  <span class="cta">See the reel →</span>
                </div>
              </div>
            </div>
          </div>
        </button>

        <button class="poster-card" data-project="1">
          <div class="poster-frame">
            <div class="poster-body has-image">
              <img class="poster-image" src="images/projects/gonewrong-poster.jpg" alt="Gone Wrong poster — a green-tinted horror movie poster with three haunted faces">
              <div class="poster-caption">
                <div class="poster-caption-row">
                  <span class="type">Visual Effects Short Film</span>
                  <span class="cta">See the reel →</span>
                </div>
              </div>
            </div>
          </div>
        </button>

        <button class="poster-card" data-project="3">
          <div class="poster-frame">
            <div class="poster-body has-image">
              <img class="poster-image poster-image--bottom" src="images/projects/citadelle-poster.jpg" alt="Domaine de la Citadelle illustration — a gnarled olive tree with the word CITADELLE beneath it">
              <div class="poster-caption">
                <div class="poster-caption-row">
                  <span class="type">Brand Collaboration</span>
                  <span class="cta">See the reel →</span>
                </div>
              </div>
            </div>
          </div>
        </button>

      </div>

      <!-- info appears here, underneath the posters, and swaps as you click -->
      <div class="project-detail" id="projectDetail">
        <div class="project-detail-panel" id="projectDetailPanel">
          <div class="modal-eyebrow" id="detailEyebrow">3D Animated Short Film</div>
          <div class="modal-title-row">
            <h3 id="detailTitle">Me in a Nut Shell</h3>
            <span class="modal-year" id="detailYear">2026</span>
          </div>
          <p class="modal-paragraph" id="detailParagraph"></p>

          <div id="stillsSection">
            <div class="modal-subhead" id="stillsSubhead">Stills</div>
            <div class="stills-gallery">
              <button class="gallery-nav prev" id="stillsPrev" aria-label="Previous still">‹</button>
              <div class="gallery-viewport" id="stillsViewport">
                <div class="gallery-content" id="stillsContent"></div>
                <button class="gallery-fullscreen-btn" id="stillsFullscreenBtn" aria-label="View full screen">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
                </button>
                <div class="gallery-item-caption" id="stillsItemCaption"></div>
                <div class="gallery-counter" id="stillsCounter"></div>
              </div>
              <button class="gallery-nav next" id="stillsNext" aria-label="Next still">›</button>
            </div>
          </div>

          <div id="featuredVideoSection" class="featured-video-frame">
            <video class="featured-video-media" id="featuredVideoEl" controls preload="metadata"></video>
            <div class="featured-video-caption" id="featuredVideoCaption"></div>
          </div>

          <div id="videosSection">
            <div class="modal-subhead">Videos</div>
            <div class="modal-video-grid" id="detailVideos"></div>
          </div>
        </div>
      </div>

      <!-- fullscreen stills viewer -->
      <div class="gallery-lightbox-overlay" id="galleryLightbox">
        <button class="gallery-lightbox-close" id="galleryLightboxClose" aria-label="Close full screen">✕</button>
        <button class="gallery-lightbox-nav prev" id="galleryLightboxPrev" aria-label="Previous still">‹</button>
        <div class="gallery-lightbox-img-wrap" id="galleryLightboxImgWrap"></div>
        <button class="gallery-lightbox-nav next" id="galleryLightboxNext" aria-label="Next still">›</button>
        <div class="gallery-lightbox-counter" id="galleryLightboxCounter"></div>
      </div>

    </div>
  </section>

  <footer class="site-footer">
    <div class="wrap">
      <a href="index.html" class="nav-mark">
        <img src="images/rw-mark.png" alt="RW monogram">
        <span class="nav-mark-text">Riley <em>Willard</em></span>
      </a>
      <span class="site-footer-meta">Character Animation · SCAD · 2026</span>
    </div>
    <div class="footer-audience-row">
      <img id="footerAudienceImg" class="footer-audience-img" src="images/footer/audience-projects.svg" data-default="images/footer/audience-projects.svg" alt="Row of theater seats">
      <div class="footer-nav-overlay">
        <a href="index.html" class="footer-nav-seg" data-page="home" style="--accent:var(--gold); left:35.36%; width:6.93%;"><span class="sr-only">Home</span></a>
        <a href="about.html" class="footer-nav-seg" data-page="about" style="--accent:var(--blue); left:40.79%; width:7.05%;"><span class="sr-only">About</span></a>
        <a href="projects.html" class="footer-nav-seg" data-page="projects" style="--accent:var(--peach); left:46.47%; width:6.99%;"><span class="sr-only">Projects</span></a>
        <a href="animation.html" class="footer-nav-seg" data-page="animation" style="--accent:var(--sage); left:52.16%; width:7.05%;"><span class="sr-only">Animation</span></a>
        <a href="contact.html" class="footer-nav-seg" data-page="contact" style="--accent:var(--lavender); left:57.65%; width:6.92%;"><span class="sr-only">Contact</span></a>
      </div>
    </div>
  </footer>

<script>
  const PROJECTS = [
    {
      eyebrow: '3D Animated Short Film',
      title: 'Me in a Nut Shell',
      bg: 'images/projects/backgrounds/bg-mian.jpg',
      year: '2026',
      paragraph: "In the middle of the woods, a little creature tries to find where he belongs.",
      stills: [
        'images/projects/mian-still-1.jpg',
        'images/projects/mian-still-2.jpg',
        'images/projects/mian-still-3.jpg',
        'images/projects/mian-still-4.jpg',
        'images/projects/mian-still-5.jpg',
        'images/projects/mian-still-6.jpg',
        'images/projects/mian-still-7.jpg',
      ],
      videos: [
        { src: 'videos/mian-trailer.mp4', poster: 'images/projects/mian-poster.jpg', label: 'Trailer' },
        { src: 'videos/mian-shot-10.mp4', poster: '', label: 'Shot 10' },
        { src: 'videos/mian-shots-13-16.mp4', poster: '', label: 'Shots 13–16' },
      ],
    },
    {
      eyebrow: 'Visual Effects Short Film',
      title: 'Gone Wrong',
      year: '2026',
      paragraph: "A visual effects short film following a group of friends whose ghost hunt goes sideways when they discover the abandoned house they're exploring is home to something much worse than a ghost.",
      stills: [
        { src: 'images/projects/gonewrong-poster-old.jpg', label: 'VFX Still' },
        { src: 'images/projects/gonewrong-stills/still-1.jpg', label: '' },
        { src: 'images/projects/gonewrong-stills/still-2.jpg', label: '' },
        { src: 'images/projects/gonewrong-stills/still-3.jpg', label: '' },
        { src: 'images/projects/gonewrong-stills/still-4.jpg', label: '' },
        { src: 'images/projects/gonewrong-stills/still-5.jpg', label: '' },
        { src: 'images/projects/gonewrong-stills/still-6.jpg', label: '' },
        { src: 'images/projects/gonewrong-stills/still-7.jpg', label: '' },
      ],
      videos: [
        { src: 'videos/projects/gonewrong-shot1.mp4', poster: '', label: 'Shot 001 — Render' },
        { src: 'videos/projects/gonewrong-shot2.mp4', poster: '', label: 'Shot 002 — Comp' },
        { src: 'videos/projects/gonewrong-shot3.mp4', poster: '', label: 'Shot 003 — Render' },
        { src: 'videos/projects/gonewrong-shot4.mp4', poster: '', label: 'Shot 004 — Comp' },
      ],
    },
    {
      eyebrow: 'VR Video Game',
      title: 'Broomsmith',
      bg: 'images/projects/backgrounds/bg-broomsmith.jpg',
      year: '2026',
      paragraph: "Led animation for Broomsmith, a VR video game, animating movement cycles for the two snail characters as well as the dragon.",
      stills: [
        { src: 'images/projects/broomsmith-stills/char-prisma.jpg', label: 'Character Design' },
        { src: 'images/projects/broomsmith-stills/char-jelly.jpg', label: 'Character Design' },
        { src: 'images/projects/broomsmith-stills/char-johnny.jpg', label: 'Character Design' },
        { src: 'images/projects/broomsmith-stills/layout-1.jpg', label: 'Layout' },
        { src: 'images/projects/broomsmith-stills/layout-2.jpg', label: 'Layout' },
        { src: 'images/projects/broomsmith-stills/layout-3.jpg', label: 'Layout' },
      ],
      videos: [
        { src: 'videos/projects/broomsmith-trailer.mp4', poster: 'images/projects/broomsmith-poster.jpg', label: 'Trailer' },
      ],
    },
    {
      eyebrow: 'Brand Collaboration',
      title: 'SCADPro Domaine de la Citadelle',
      bg: 'images/projects/backgrounds/bg-citadelle.jpg',
      year: '2025',
      paragraph: "Led a two-month rebranding initiative for a winery in Lacoste, France — developing visual identity systems in Adobe Illustrator and Canva, producing 3D brand visualizations in Autodesk Maya, and designing packaging prototypes in Rhino.",
      stillsLabel: 'Slide Deck',
      stills: [
        'images/projects/citadelle-slides/slide-02.jpg','images/projects/citadelle-slides/slide-03.jpg',
        'images/projects/citadelle-slides/slide-04.jpg','images/projects/citadelle-slides/slide-05.jpg','images/projects/citadelle-slides/slide-06.jpg',
        'images/projects/citadelle-slides/slide-07.jpg','images/projects/citadelle-slides/slide-08.jpg','images/projects/citadelle-slides/slide-09.jpg',
        'images/projects/citadelle-slides/slide-10.jpg','images/projects/citadelle-slides/slide-11.jpg','images/projects/citadelle-slides/slide-12.jpg',
        'images/projects/citadelle-slides/slide-13.jpg','images/projects/citadelle-slides/slide-14.jpg','images/projects/citadelle-slides/slide-15.jpg',
        'images/projects/citadelle-slides/slide-16.jpg','images/projects/citadelle-slides/slide-17.jpg','images/projects/citadelle-slides/slide-18.jpg',
        'images/projects/citadelle-slides/slide-19.jpg','images/projects/citadelle-slides/slide-20.jpg','images/projects/citadelle-slides/slide-21.jpg',
        'images/projects/citadelle-slides/slide-22.jpg','images/projects/citadelle-slides/slide-23.jpg','images/projects/citadelle-slides/slide-24.jpg',
        'images/projects/citadelle-slides/slide-25.jpg','images/projects/citadelle-slides/slide-26.jpg','images/projects/citadelle-slides/slide-27.jpg',
        'images/projects/citadelle-slides/slide-28.jpg','images/projects/citadelle-slides/slide-29.jpg',
      ],
      videos: [
        { src: 'videos/projects/citadelle-opener.mp4', poster: '', label: 'Opener' },
        { src: 'videos/projects/citadelle-sculpture-walk.mp4', poster: '', label: 'Sculpture Walk' },
      ],
    },
  ];

  const detail = document.getElementById('projectDetail');
  const detailBgBleed = document.getElementById('projectDetailBgBleed');
  const detailPanel = document.getElementById('projectDetailPanel');
  const detailEyebrow = document.getElementById('detailEyebrow');
  const detailTitle = document.getElementById('detailTitle');
  const detailYear = document.getElementById('detailYear');
  const detailParagraph = document.getElementById('detailParagraph');
  const detailVideos = document.getElementById('detailVideos');
  const videosSection = document.getElementById('videosSection');
  const stillsSubhead = document.getElementById('stillsSubhead');
  const featuredVideoSection = document.getElementById('featuredVideoSection');
  const featuredVideoEl = document.getElementById('featuredVideoEl');
  const featuredVideoCaption = document.getElementById('featuredVideoCaption');
  const posterCards = document.querySelectorAll('.poster-card');
  const stillsSection = document.getElementById('stillsSection');

  const stillsContent = document.getElementById('stillsContent');
  const stillsCounter = document.getElementById('stillsCounter');
  const stillsItemCaption = document.getElementById('stillsItemCaption');
  const stillsPrev = document.getElementById('stillsPrev');
  const stillsNext = document.getElementById('stillsNext');
  const stillsFullscreenBtn = document.getElementById('stillsFullscreenBtn');

  const galleryLightbox = document.getElementById('galleryLightbox');
  const galleryLightboxImgWrap = document.getElementById('galleryLightboxImgWrap');
  const galleryLightboxCounter = document.getElementById('galleryLightboxCounter');
  const galleryLightboxClose = document.getElementById('galleryLightboxClose');
  const galleryLightboxPrev = document.getElementById('galleryLightboxPrev');
  const galleryLightboxNext = document.getElementById('galleryLightboxNext');

  const stillIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="4" width="18" height="16" rx="1"/><circle cx="8.5" cy="10" r="1.6"/><path d="M21 16l-5.5-5.5L9 17"/></svg>';
  const videoIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M10 9.5l5 2.5-5 2.5z" fill="currentColor" stroke="none"/></svg>';

  let openIndex = null;
  let stillsList = [];
  let currentStillIndex = 0;
  let lightboxOpen = false;

  function buildStillsList(p){
    if(p.stills && p.stills.length){
      return p.stills.map((item, i) => {
        if(typeof item === 'string'){
          return { type: 'image', src: item, alt: `${p.title} — still ${i+1}`, label: '' };
        }
        return { type: 'image', src: item.src, alt: item.label ? `${p.title} — ${item.label}` : `${p.title} — still ${i+1}`, label: item.label || '' };
      });
    }
    const n = p.stillsCount || 0;
    return Array.from({ length: n }, (_, i) => ({ type: 'placeholder', label: `Still ${i+1}` }));
  }

  function renderStillSlide(){
    const slide = stillsList[currentStillIndex];
    if(!slide){
      stillsContent.innerHTML = '';
      stillsCounter.textContent = '';
      stillsItemCaption.textContent = '';
      stillsItemCaption.style.display = 'none';
      return;
    }
    stillsContent.innerHTML = slide.type === 'image'
      ? `<img src="${slide.src}" alt="${slide.alt}">`
      : `<div class="gallery-placeholder">${stillIcon}<span>${slide.label}</span></div>`;
    stillsCounter.textContent = `${currentStillIndex + 1} / ${stillsList.length}`;
    stillsPrev.disabled = stillsList.length <= 1;
    stillsNext.disabled = stillsList.length <= 1;

    if(slide.type === 'image' && slide.label){
      stillsItemCaption.textContent = slide.label;
      stillsItemCaption.style.display = '';
    } else {
      stillsItemCaption.textContent = '';
      stillsItemCaption.style.display = 'none';
    }

    if(lightboxOpen) renderLightboxSlide();
  }

  function stepStill(delta){
    if(!stillsList.length) return;
    currentStillIndex = (currentStillIndex + delta + stillsList.length) % stillsList.length;
    renderStillSlide();
  }

  function renderLightboxSlide(){
    const slide = stillsList[currentStillIndex];
    if(!slide){ galleryLightboxImgWrap.innerHTML = ''; return; }
    galleryLightboxImgWrap.innerHTML = slide.type === 'image'
      ? `<img src="${slide.src}" alt="${slide.alt}">`
      : `<div class="gallery-placeholder" style="color:#f1e6cc;">${stillIcon}<span>${slide.label}</span></div>`;
    galleryLightboxCounter.textContent = `${currentStillIndex + 1} / ${stillsList.length}`;
  }

  function openLightbox(){
    if(!stillsList.length) return;
    lightboxOpen = true;
    renderLightboxSlide();
    galleryLightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox(){
    lightboxOpen = false;
    galleryLightbox.classList.remove('open');
    document.body.style.overflow = '';
  }

  stillsPrev.addEventListener('click', () => stepStill(-1));
  stillsNext.addEventListener('click', () => stepStill(1));
  stillsFullscreenBtn.addEventListener('click', openLightbox);
  galleryLightboxClose.addEventListener('click', closeLightbox);
  galleryLightboxPrev.addEventListener('click', () => stepStill(-1));
  galleryLightboxNext.addEventListener('click', () => stepStill(1));
  galleryLightbox.addEventListener('click', (e) => { if(e.target === galleryLightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => {
    if(!lightboxOpen) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowLeft') stepStill(-1);
    if(e.key === 'ArrowRight') stepStill(1);
  });

  function fillDetail(index){
    const p = PROJECTS[index];
    detailEyebrow.textContent = p.eyebrow;
    detailTitle.textContent = p.title;
    detailYear.textContent = p.year || '';
    detailParagraph.textContent = p.paragraph;

    if(p.bg){
      detailBgBleed.style.setProperty('--detail-bg', `url('${p.bg}')`);
    }

    if(p.featuredVideo){
      featuredVideoSection.style.display = '';
      featuredVideoEl.innerHTML = `<source src="${p.featuredVideo.src}" type="video/mp4">`;
      if(p.featuredVideo.poster) featuredVideoEl.setAttribute('poster', p.featuredVideo.poster);
      else featuredVideoEl.removeAttribute('poster');
      featuredVideoEl.load();
      featuredVideoCaption.textContent = p.featuredVideo.label || '';
    } else {
      featuredVideoSection.style.display = 'none';
      featuredVideoEl.removeAttribute('src');
      featuredVideoEl.innerHTML = '';
      featuredVideoEl.load();
    }

    stillsSubhead.textContent = p.stillsLabel || 'Stills';

    stillsList = buildStillsList(p);
    currentStillIndex = 0;
    stillsSection.style.display = stillsList.length ? '' : 'none';
    renderStillSlide();

    detailVideos.innerHTML = '';
    const videoCount = (p.videos && p.videos.length) || p.videosCount || 0;
    videosSection.style.display = videoCount ? '' : 'none';
    if(p.videos && p.videos.length){
      p.videos.forEach(v => {
        detailVideos.innerHTML += `<div class="video-tile"><video class="video-tile-media" controls preload="metadata" poster="${v.poster || ''}"><source src="${v.src}" type="video/mp4"></video><div class="video-caption">${v.label}</div></div>`;
      });
    } else {
      for(let i=0;i<(p.videosCount||0);i++){ detailVideos.innerHTML += `<div class="video-slot">${videoIcon}<span>Video ${i+1}</span></div>`; }
    }
  }

  const projectsSection = document.getElementById('projects');

  function positionBgBleed(){
    if(openIndex === null){
      detailBgBleed.classList.remove('show');
      return;
    }
    const p = PROJECTS[openIndex];
    if(!p.bg){
      detailBgBleed.classList.remove('show');
      return;
    }
    const sectionRect = projectsSection.getBoundingClientRect();
    const detailRect = detail.getBoundingClientRect();
    detailBgBleed.style.top = (detailRect.top - sectionRect.top) + 'px';
    detailBgBleed.style.height = detail.scrollHeight + 'px';
    detailBgBleed.classList.add('show');
  }

  function selectProject(index){
    posterCards.forEach(c => c.classList.toggle('active', Number(c.dataset.project) === index));
    if(openIndex === index){
      detail.classList.remove('open');
      posterCards.forEach(c => c.classList.remove('active'));
      openIndex = null;
      closeLightbox();
      positionBgBleed();
      return;
    }
    fillDetail(index);
    detail.classList.add('open');
    openIndex = index;
    closeLightbox();
    positionBgBleed();
    setTimeout(positionBgBleed, 520);
  }

  window.addEventListener('resize', () => { if(openIndex !== null) positionBgBleed(); });

  posterCards.forEach(card => {
    card.addEventListener('click', () => selectProject(Number(card.dataset.project)));
  });
</script>

<script>
  (function(){
    const img = document.getElementById('footerAudienceImg');
    if(!img) return;
    const defaultSrc = img.dataset.default;
    const IMAGES = {
      home: 'images/footer/audience-home.svg',
      about: 'images/footer/audience-about.svg',
      projects: 'images/footer/audience-projects.svg',
      animation: 'images/footer/audience-animation.svg',
      contact: 'images/footer/audience-contact.svg',
    };
    const COLORS = { home:'#c9a24a', about:'#7c8ec2', projects:'#e2a483', animation:'#8ba474', contact:'#a68cbd' };

    function lightUp(page){
      img.src = IMAGES[page];
      img.style.filter = `drop-shadow(0 0 14px ${COLORS[page]}) drop-shadow(0 0 4px ${COLORS[page]})`;
    }
    function reset(){
      img.src = defaultSrc;
      img.style.filter = '';
    }

    document.querySelectorAll('.footer-nav-seg').forEach(seg => {
      const page = seg.dataset.page;
      seg.addEventListener('mouseenter', () => lightUp(page));
      seg.addEventListener('mouseleave', reset);
      seg.addEventListener('focus', () => lightUp(page));
      seg.addEventListener('blur', reset);
    });
  })();
</script>


</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riley Willard - Fine Arts</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="https://use.typekit.net/lez4ize.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-fine-arts">
  <div class="scene scene-light">

    <!-- Navigation -->
    <nav class="navbar navbar-green navbar-visible">
      <button class="menu-toggle">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="nav-logo">
        <img src="assets/RileyWillard_3dAnimator_Typography.svg" alt="Riley Willard 3D Animator">
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-item" data-page="home">Demo Reel</a>
        <a href="animation.html" class="nav-item" data-page="animation">Animation</a>
        <a href="production.html" class="nav-item" data-page="production">Production</a>
        <a href="fine-arts.html" class="nav-item active" data-page="fine-arts">Fine Arts</a>
        <a href="resume.html" class="nav-item" data-page="resume">Resume</a>
        <a href="about.html" class="nav-item" data-page="about">About Me</a>
      </div>
      <div class="nav-contact-info">
        <a href="mailto:rileywillardportfolio@gmail.com" class="nav-contact nav-email">rileywillardportfolio@gmail.com</a>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="fine-arts-content">

      <!-- Desktop Book -->
      <div class="book-wrapper">
        <h1 class="fine-arts-title">Sketches / Paintings</h1>
        <div id="book"></div>
        <div class="book-controls">
          <button id="book-prev" class="book-nav">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <span class="book-counter" id="book-counter">1</span>
          <button id="book-next" class="book-nav">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>
      </div>

      <!-- Mobile Slideshow -->
      <div class="mobile-book">
        <div class="mobile-tabs">
          <button class="mobile-tab active" data-vol="1">Vol. 1</button>
          <button class="mobile-tab" data-vol="2">Vol. 2</button>
        </div>
        <div class="mobile-slides" id="mobile-vol-1"></div>
        <div class="mobile-slides" id="mobile-vol-2"></div>
        <div class="mobile-controls">
          <button class="book-nav" id="mobile-prev">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <span class="book-counter" id="mobile-counter">1 / 31</span>
          <button class="book-nav" id="mobile-next">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>
      </div>

    </div><!-- end fine-arts-content -->

    <!-- Lightbox for zoom -->
    <div class="book-lightbox" id="book-lightbox">
      <button class="book-lightbox-close" id="book-lightbox-close">
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <img class="book-lightbox-img" id="book-lightbox-img" src="" alt="">
    </div>

  </div><!-- end scene -->

  <script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>
  <script src="script-fine-arts.js"></script>
  <script src="mobile.js"></script>
</body>
</html>

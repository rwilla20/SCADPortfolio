    /* Smaller demo reel */
    .demoreel-container {

    }

    /* Allow native controls to work */
    .demoreel-video video {
      pointer-events: auto !important;
    }

    /* ===== STAINED GLASS BACKGROUND ===== */
    #stained-glass-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      transition: opacity 0.9s ease;
    }
    .scene-dark #stained-glass-bg {
      opacity: 0;
    }

    .scene        { background: transparent !important; }
    .scene-light  { background: transparent !important; }
    .scene-dark   { background: #060608 !important; transition: background-color 0.8s ease; }
  </style>
</head>

  <script>
  (function () {
    const canvas = document.getElementById('stained-glass-bg');
    const ctx = canvas.getContext('2d');

    // Riley's palette from style.css :root variables
    // --color-offwhite: #ffefcc  → 255, 239, 204
    // --color-green:    #6d8b6c  → 109, 139, 108
    // --color-blue:     #6f6dac  → 111, 109, 172
    // --color-purple:   #836190  → 131,  97, 144
    // --color-peach:    #de6f5f  → 222, 111,  95

    const glassColors = [
      { r: 222, g: 111, b:  95 },  // --color-peach
      { r: 240, g: 140, b: 110 },  // peach light
      { r: 190, g:  80, b:  65 },  // peach deep
      { r: 109, g: 139, b: 108 },  // --color-green
      { r: 140, g: 175, b: 138 },  // green light
      { r:  75, g: 105, b:  74 },  // green deep
      { r: 111, g: 109, b: 172 },  // --color-blue
      { r: 145, g: 143, b: 210 },  // blue light
      { r:  80, g:  78, b: 140 },  // blue deep
      { r: 131, g:  97, b: 144 },  // --color-purple
      { r: 168, g: 128, b: 182 },  // purple light
      { r: 100, g:  68, b: 112 },  // purple deep
      { r: 255, g: 239, b: 204 },  // --color-offwhite
      { r: 255, g: 220, b: 160 },  // warm amber glow
      { r: 240, g: 200, b: 130 },  // deep gold
    ];

    let panes = [];
    let W, H;

    function initPanes() {
      panes = [];
      const count = 20;
      for (let i = 0; i < count; i++) {
        const c = glassColors[i % glassColors.length];
        panes.push({
          bx: Math.random() * W,
          by: Math.random() * H,
          rx: W * (0.22 + Math.random() * 0.32),
          ry: H * (0.20 + Math.random() * 0.30),
          vx: (Math.random() - 0.5) * 0.14,
          vy: (Math.random() - 0.5) * 0.10,
          angle: Math.random() * Math.PI * 2,
          va:    (Math.random() - 0.5) * 0.0003,
          r: c.r, g: c.g, b: c.b,
          alpha: 0.20 + Math.random() * 0.22,
          pulseOffset: Math.random() * Math.PI * 2,
          pulseSpeed:  0.0003 + Math.random() * 0.0005,
        });
      }
    }

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
      initPanes();
    }

    let t = 0;

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Offwhite base — matches --color-offwhite
      ctx.fillStyle = '#ffefcc';
      ctx.fillRect(0, 0, W, H);

      // Drifting colored light pools
      for (const p of panes) {
        p.bx += p.vx;
        p.by += p.vy;
        p.angle += p.va;

        if (p.bx < -p.rx * 1.5) p.bx = W + p.rx;
        if (p.bx >  W + p.rx * 1.5) p.bx = -p.rx;
        if (p.by < -p.ry * 1.5) p.by = H + p.ry;
        if (p.by >  H + p.ry * 1.5) p.by = -p.ry;

        const pulse = 1 + 0.10 * Math.sin(t * p.pulseSpeed + p.pulseOffset);
        const alpha = p.alpha * pulse;

        ctx.save();
        ctx.translate(p.bx, p.by);
        ctx.rotate(p.angle);
        ctx.scale(1, p.ry / p.rx);

        const grd = ctx.createRadialGradient(0, 0, 0, 0, 0, p.rx);
        grd.addColorStop(0,    `rgba(${p.r},${p.g},${p.b},${Math.min(alpha, 0.58).toFixed(3)})`);
        grd.addColorStop(0.45, `rgba(${p.r},${p.g},${p.b},${(alpha * 0.55).toFixed(3)})`);
        grd.addColorStop(1,    `rgba(${p.r},${p.g},${p.b},0)`);

        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(0, 0, p.rx, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Lead lines — dark dividers between glass panes
      ctx.save();
      ctx.strokeStyle = 'rgba(20,14,8,0.18)';
      ctx.lineWidth = 3;
      ctx.lineCap = 'butt';

      const lines = [
        [W*0.10, 0,      W*0.45, H],
        [W*0.28, 0,      W*0.60, H],
        [W*0.50, 0,      W*0.80, H],
        [W*0.70, 0,      W*0.95, H],
        [W*0.85, 0,      W*1.05, H*0.7],
        [0,      H*0.15, W*0.90, H*0.55],
        [0,      H*0.40, W*0.85, H*0.80],
        [0,      H*0.65, W*0.75, H*1.05],
        [0,      H*0.30, W*0.50, H*0.22],
        [W*0.30, H*0.72, W,      H*0.58],
      ];
      for (const [x1,y1,x2,y2] of lines) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }

      ctx.lineWidth = 1.5;
      ctx.strokeStyle = 'rgba(20,14,8,0.10)';
      const lines2 = [
        [W*0.18, 0,      W*0.38, H*0.5],
        [W*0.38, 0,      W*0.55, H*0.7],
        [W*0.60, 0,      W*0.72, H*0.6],
        [0,      H*0.55, W*0.60, H*0.90],
        [W*0.20, H,      W*0.55, H*0.3],
        [W*0.65, H,      W*0.90, H*0.2],
      ];
      for (const [x1,y1,x2,y2] of lines2) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      }
      ctx.restore();

      // Bright source light (upper left — the "window")
      const src = ctx.createRadialGradient(W*0.08, H*0.08, 0, W*0.08, H*0.08, W*0.45);
      src.addColorStop(0,   'rgba(255,239,204,0.60)');
      src.addColorStop(0.3, 'rgba(255,239,204,0.22)');
      src.addColorStop(1,   'rgba(255,239,204,0)');
      ctx.fillStyle = src;
      ctx.fillRect(0, 0, W, H);

      // Warm peach floor reflection
      const floorGrd = ctx.createLinearGradient(0, H * 0.70, 0, H);
      floorGrd.addColorStop(0,   'rgba(222,111,95,0)');
      floorGrd.addColorStop(0.5, `rgba(222,111,95,${(0.08 + 0.03 * Math.sin(t * 0.0003)).toFixed(3)})`);
      floorGrd.addColorStop(1,   'rgba(190,80,65,0.10)');
      ctx.fillStyle = floorGrd;
      ctx.fillRect(0, H * 0.70, W, H * 0.30);

      // Vignette
      const vig = ctx.createRadialGradient(W*0.5, H*0.45, H*0.12, W*0.5, H*0.45, H*0.85);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(15,10,4,0.28)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, W, H);

      t++;
      requestAnimationFrame(draw);
    }

    resize();
    window.addEventListener('resize', resize);
    draw();
  })();
  </script>

  <script src="script-home.js"></script>
  <script src="mobile.js"></script>
</body>
</html>

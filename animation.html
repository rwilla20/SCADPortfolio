      <h1>Animation</h1>
      
      <!-- Animation Project 1: Midas Touch -->
      <div class="animation-project">
        <div class="animation-main">
          <h2>Midas Touch</h2>
          <div class="video-container">

            <video controls>

          <div class="process-box">

            <video controls>

      <!-- Animation Project 2: Lip Sync -->
